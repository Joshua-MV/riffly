[package]
name = "riffly"
version = "0.1.0"
description = "Riffly: guitar tuner, chord finder and play-along"
authors = ["Riffly"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "riffly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.11.2"
cmake = "0.1"
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
mp3lame-encoder = "0.3.0"
# One-time download of the on-device lyrics model (whisper.cpp itself is built by build.rs).
ureq = "3"
